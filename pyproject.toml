[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spec-trace"
version = "0.1.0"
description = "Local-first planning specification traceability tool"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
spec-trace = "spec_trace.cli:main"
spec-trace-web = "spec_trace.web:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
spec_trace = ["migrations/*.sql", "web_assets/*"]

[dependency-groups]
dev = [
    "ruff>=0.16.8",
]
